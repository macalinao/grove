name: Release-plz

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Publishes to crates.io and tags/releases any version not yet published
  # (i.e. after a release PR merges).
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'macalinao'
    permissions:
      contents: write
    steps:
      - &check-token
        name: Check for CARGO_REGISTRY_TOKEN
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping release-plz"
          fi
      - &checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - &toolchain
        if: steps.token.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.token.outputs.present == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens/updates the release PR: version bumps + CHANGELOG from conventional
  # commits.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'macalinao'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *check-token
      - *checkout
      - *toolchain
      - if: steps.token.outputs.present == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
