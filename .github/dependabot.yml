version: 2
updates:
  # Rust workspace dependencies (Cargo.toml + Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Batch routine version bumps into one PR to cut review noise.
      cargo-minor:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  # GitHub Actions used in CI workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
