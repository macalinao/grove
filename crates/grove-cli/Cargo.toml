[package]
name = "grove-cli"
description = "Grove — a Rust git worktree runner (a gtr alternative)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "grove_cli"
path = "src/lib.rs"

[[bin]]
name = "grove"
path = "src/main.rs"

# Installed alongside `grove` so `git grove …` works as a git subcommand
# (git runs the `git-grove` executable it finds on PATH).
[[bin]]
name = "git-grove"
path = "src/bin/git-grove.rs"

[dependencies]
anyhow.workspace = true
bpaf.workspace = true
console.workspace = true
kdl.workspace = true
grove-adapters.workspace = true
grove-core.workspace = true
grove-tasks.workspace = true
grove-shell.workspace = true
